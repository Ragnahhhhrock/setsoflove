<!-- @dsCard group="Profile" height=230 subtitle="Self-reported, shown in kg and lb" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;padding:24px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.card{width:340px;box-sizing:border-box;padding:var(--space-5);background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-lg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.tile{padding:var(--space-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md)}
.eyebrow{font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-muted)}
.stat{font-family:var(--font-display);font-size:32px;line-height:32px;font-weight:800;letter-spacing:-0.01em;margin-top:var(--space-2)}
.stat small{font-size:16px;font-weight:700}
.lb{font-size:14px;line-height:20px;color:var(--ink-muted);margin-top:var(--space-1)}
</style>
<div class="card"><div class="grid">
<div class="tile"><div class="eyebrow">Bench</div><div class="stat">100 <small>kg</small></div><div class="lb">220 lb</div></div>
<div class="tile"><div class="eyebrow">Squat</div><div class="stat">140 <small>kg</small></div><div class="lb">309 lb</div></div>
<div class="tile"><div class="eyebrow">Deadlift</div><div class="stat">180 <small>kg</small></div><div class="lb">397 lb</div></div>
<div class="tile"><div class="eyebrow">Overhead press</div><div class="stat">60 <small>kg</small></div><div class="lb">132 lb</div></div>
</div></div>
