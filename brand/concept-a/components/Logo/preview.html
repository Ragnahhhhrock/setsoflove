<style>
body{margin:0;padding:24px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.panel{display:flex;align-items:center;justify-content:center;padding:20px 28px;border-radius:var(--radius-lg);border:1px solid var(--line)}
.light{background:var(--paper)}
.dark{background:var(--night)}
.panel img{height:72px;width:auto;display:block}
.sizes{display:flex;align-items:flex-end;gap:28px}
.cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin-top:8px}
.icon{border-radius:22%}
</style>
<div class="row">
<div class="panel light"><img src="../../logo/setsoflove-lockup.png" alt="SetsOfLove"></div>
<div class="panel dark"><img src="../../logo/setsoflove-lockup-reversed.png" alt="SetsOfLove"></div>
</div>
<div class="sizes">
<div><img src="../../logo/setsoflove-mark.png" width="112" alt="SetsOfLove logo"><div class="cap">Mark, 112px</div></div>
<div><img src="../../logo/setsoflove-mark.png" width="56" alt="SetsOfLove logo"><div class="cap">Mark, 56px</div></div>
<div><img src="../../logo/setsoflove-mark-small.png" width="32" alt="SetsOfLove logo"><div class="cap">Small, 32px</div></div>
<div><img src="../../logo/setsoflove-mark-small.png" width="24" alt="SetsOfLove logo"><div class="cap">Small, 24px</div></div>
<div><img class="icon" src="../../logo/setsoflove-app-icon.png" width="96" height="96" alt="SetsOfLove app icon"><div class="cap">App icon</div></div>
</div>
