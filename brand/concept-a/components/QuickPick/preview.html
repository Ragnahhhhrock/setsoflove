<!-- @dsCard group="Forms" height=200 subtitle="Tap to add, tap again to remove" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;padding:24px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.k{font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 var(--space-2)}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-5)}
.chip{display:inline-flex;align-items:center;gap:var(--space-2);min-height:44px;padding:0 var(--space-4);font-family:var(--font-sans);font-size:14px;line-height:16px;font-weight:600;letter-spacing:0.02em;border-radius:var(--radius-pill);border:1.5px solid var(--control-border);background:none;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--action);border-color:var(--action);color:var(--on-action)}
.chip svg{display:none}
.chip[aria-pressed="true"] svg{display:block}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
<p class="k">Link stub ideas</p>
<div class="row" id="stubs">
<button class="chip" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>sam-t</button>
<button class="chip" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>sam-29</button>
<button class="chip" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>sam-subiaco</button>
</div>
<p class="k">How you train</p>
<div class="row">
<button class="chip" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>[SUGGESTION]</button>
<button class="chip" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>[SUGGESTION]</button>
</div>
<script>
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')==='true'?'false':'true')));
</script>
