<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Search – SetsOfLove</title>
<meta name="theme-color" content="#FFF6EC">
<link rel="manifest" href="/site.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<script src="/analytics.js" defer></script>
</head>
<body>
<header class="site-header">
  <a href="/" aria-label="SetsOfLove home"><img src="/brand/logo-lockup.png" alt="SetsOfLove" height="32"></a>
  <nav><a href="/profile">Your profile</a><a href="/requests">Requests</a><button id="signout" class="btn-link" type="button">Sign out</button></nav>
</header>
<main class="page">
  <h1>Search</h1>
  <p class="muted">Find live profiles by first name, link, suburb, city or country. Results are in alphabetical order.</p>
  <form id="form" role="search" novalidate>
    <div class="field">
      <label for="q">Search profiles</label>
      <input id="q" name="q" type="text" maxlength="40" autocomplete="off" enterkeyhint="search" placeholder="Name, suburb or city">
    </div>
    <button id="submit" class="btn btn-block" type="submit" data-label="Search">Search</button>
  </form>
  <div id="message" class="msg" role="alert" hidden></div>
  <p id="status" class="small muted space-top" role="status" aria-live="polite"></p>
  <ul id="results" class="results"></ul>
</main>
<script type="module" src="/search.js"></script>
<footer class="site-footer">
  <ul>
    <li><a href="/terms/">Terms of use</a></li>
    <li><a href="/privacy/">Privacy policy</a></li>
    <li><a href="/contact">Contact</a></li>
  </ul>
  <p class="small">Another <a href="https://malgordon.com/">Mal Gordon</a> creation</p>
</footer>
</body>
</html>
