<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in – SetsOfLove</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="site-header">
  <a href="/" aria-label="SetsOfLove home"><img src="/brand/logo-lockup.svg" alt="SetsOfLove" height="32"></a>
  <nav><a href="/signup">Create account</a></nav>
</header>
<main class="page">
  <h1>Sign in</h1>
  <form id="form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div id="message" class="msg" role="alert" hidden></div>
    <button id="submit" class="btn btn-block" type="submit" data-label="Sign in">Sign in</button>
  </form>
  <p class="small muted space-top">New here? <a href="/signup">Create account</a></p>
</main>
<script type="module" src="/signin.js"></script>
</body>
</html>
