<body>
<header class="site-header">
  <a href="/" aria-label="SetsOfLove home"><img src="/brand/logo-lockup.png" alt="SetsOfLove" height="32"></a>
  <nav><a href="/signin">Sign in</a></nav>
</header>
<main class="page narrow">
  <h1>Contact us</h1>
  <p>Questions, feedback or a profile to report? Send us a message and we'll reply by email.</p>
  <form id="form" novalidate>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="80" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required>
    </div>
    <div class="field">
      <label for="msg">Message</label>
      <textarea id="msg" name="message" maxlength="2000" required></textarea>
      <p class="help">If you're reporting a profile, include its link</p>
    </div>
    <div hidden><label for="website">Leave this empty</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
    <div id="message" class="msg" role="alert" hidden></div>
    <button id="submit" class="btn btn-block" type="submit" data-label="Send message">Send message</button>
  </form>
</main>
<script type="module" src="/contact.js"></script>
