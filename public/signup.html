<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Create account – SetsOfLove</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="site-header">
  <a href="/" aria-label="SetsOfLove home"><img src="/brand/logo-lockup.svg" alt="SetsOfLove" height="32"></a>
  <nav><a href="/signin">Sign in</a></nav>
</header>
<main class="page">
  <h1>Create account</h1>
  <p>Keep it friendly and keep it clean. We approve every profile before it goes live.</p>
  <form id="form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
      <p class="help">At least 10 characters</p>
    </div>
    <div class="field">
      <label for="code">Invite code</label>
      <input id="code" name="code" type="text" autocomplete="off" autocapitalize="none" required>
      <p class="help">Ask whoever invited you</p>
    </div>
    <div class="checkbox">
      <input id="confirm" type="checkbox">
      <label for="confirm">I'm a member of the gym, I'm a man, and I'm looking to meet a woman</label>
    </div>
    <div id="message" class="msg" role="alert" hidden></div>
    <button id="submit" class="btn btn-block" type="submit" data-label="Create account">Create account</button>
  </form>
  <p class="small muted space-top">Already have an account? <a href="/signin">Sign in</a></p>
</main>
<script type="module" src="/signup.js"></script>
</body>
</html>
